<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17301d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #minimap {
    position: fixed; left: 14px; top: 14px; width: 190px; height: 143px;
    border-radius: 8px; box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Solara Bay: explore a coastal city on foot and by car, take missions, outrun the police"></canvas>
<canvas id="minimap" width="190" height="143" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
